<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Carte Interactive avec Clustering et Effets</title>
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <!-- Mapbox GL CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css"
    rel="stylesheet"
  />
  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    /* Un style de base pour le label de cluster */
    .cluster-count {
      color: white;
      font-family: sans-serif;
      font-size: 12px;
      text-align: center;
      line-height: 30px;
      border: 2px solid white;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      background: #666;
    }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  /* =============================
     1. Clé d'accès Mapbox
     ============================= */
  mapboxgl.accessToken = 'pk.eyJ1Ijoia2FsZWJzaWthMjAyNSIsImEiOiJjbThlZXhzN2owMHR2MmlzNWNxcHlqeDQ2In0.UvvmBCG_ANQnSkZ_vV-cmg';
  
  /* =============================
     2. Initialisation de la carte
     ============================= */
  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/light-v11',
    center: [-50, 20], // Coordonnées approximatives de l'Atlantique
    zoom: 3
  });

  /* =============================
     3. Zones marines (bounding boxes)
        Pour l’exemple, on définit 2 rectangles
        (Atlantique et Pacifique, très approximatifs)
     ============================= */
  const oceanBoxes = [
    // [lonMin, latMin, lonMax, latMax]
    // Atlantique Nord (approx)
    [-80, 0, -20, 50],
    // Pacifique Nord (approx)
    [-160, 10, -120, 50]
  ];

  /* =============================
     4. Génération de 100 points
        uniquement dans ces zones marines
     ============================= */
  function generatePointsInOceanBoxes(count) {
    const features = [];
    const boxesCount = oceanBoxes.length;

    for (let i = 0; i < count; i++) {
      // Sélectionne au hasard l'une de nos boîtes
      const box = oceanBoxes[Math.floor(Math.random() * boxesCount)];
      // Génère une coordonnée dans cette box
      const randLon = box[0] + (box[2] - box[0]) * Math.random();
      const randLat = box[1] + (box[3] - box[1]) * Math.random();

      // Intensité arbitraire [0..1], pour varier la taille du cercle
      const intensity = Math.random();
      // Attribuons un type (pollution, temp, normal)
      let pointType = 'normal';
      if (intensity > 0.6) {
        pointType = 'pollution';
      } else if (intensity > 0.3) {
        pointType = 'temp';
      }

      features.push({
        type: 'Feature',
        properties: {
          title: `Marine Point #${i}`,
          description: `Type: ${pointType}, intensity: ${intensity.toFixed(2)}`,
          intensity: intensity,
          pointType
        },
        geometry: {
          type: 'Point',
          coordinates: [randLon, randLat]
        }
      });
    }

    return {
      type: 'FeatureCollection',
      features
    };
  }

  // On génère 100 points
  const geojsonData = generatePointsInOceanBoxes(100);

  /* =============================
     5. Ajout de la source avec clustering
     ============================= */
  map.on('load', () => {
    map.addSource('my-points', {
      type: 'geojson',
      data: geojsonData,
      cluster: true,          // Active le regroupement
      clusterMaxZoom: 8,      // Zoom max pour regrouper
      clusterRadius: 40       // Rayon en pixels pour le cluster
    });

    /* =============================
       5.1. Layer : Points non clusterisés
       ============================= */
    map.addLayer({
      id: 'unclustered-points',
      type: 'circle',
      source: 'my-points',
      filter: ['!', ['has', 'point_count']],
      paint: {
        // Rayon dépend de l’intensité (0 -> 4 px, 1 -> 12 px)
        'circle-radius': [
          'interpolate', ['linear'], ['get', 'intensity'],
          0, 4,
          1, 12
        ],
        // Couleur dépend du type (pollution/temp/normal)
        'circle-color': [
          'match',
          ['get', 'pointType'],
          'pollution', '#FF0000',
          'temp',      '#0000FF',
                       '#00FF00' // normal
        ],
        'circle-opacity': 0.7,
        'circle-stroke-width': 1,
        'circle-stroke-color': '#fff'
      }
    });

    /* =============================
       5.2. Layer : Effet de halo/pulsation
            visible seulement pour intensité > 0.8
       ============================= */
    map.addLayer({
      id: 'unclustered-points-halo',
      type: 'circle',
      source: 'my-points',
      filter: [
        'all',
        ['!', ['has', 'point_count']],
        ['>', ['get', 'intensity'], 0.8]
      ],
      paint: {
        'circle-radius': [
          'interpolate', ['linear'], ['zoom'],
          0, 10,
          15, 20
        ],
        'circle-color': '#ff0000',
        'circle-opacity': 0.4
      }
    });

    /* =============================
       5.3. Layers : Clusters + Count
       ============================= */
    // a) Cercle de cluster
    map.addLayer({
      id: 'clusters',
      type: 'circle',
      source: 'my-points',
      filter: ['has', 'point_count'],
      paint: {
        'circle-color': '#51bbd6',
        'circle-radius': [
          'step',
          ['get', 'point_count'],
          20,  // Rayon si le cluster a < 10 points
          10, 30,  // Si > 10 points => 30
          50, 40   // Si > 50 points => 40
        ]
      }
    });

    // b) Nombre de points dans chaque cluster (texte)
    map.addLayer({
      id: 'cluster-count',
      type: 'symbol',
      source: 'my-points',
      filter: ['has', 'point_count'],
      layout: {
        'text-field': '{point_count_abbreviated}',
        'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
        'text-size': 12
      },
      paint: {
        'text-color': '#ffffff'
      }
    });

    /* =============================
       6. Popup au clic sur un point (non clusterisé)
       ============================= */
    map.on('click', 'unclustered-points', (e) => {
      const coordinates = e.features[0].geometry.coordinates.slice();
      const props = e.features[0].properties;
      const html = `<strong>${props.title}</strong><br>${props.description}`;

      new mapboxgl.Popup()
        .setLngLat(coordinates)
        .setHTML(html)
        .addTo(map);
    });

    /* =============================
       7. Zoom sur cluster au clic
       ============================= */
    map.on('click', 'clusters', (e) => {
      const features = map.queryRenderedFeatures(e.point, {
        layers: ['clusters']
      });
      const clusterId = features[0].properties.cluster_id;
      map.getSource('my-points').getClusterExpansionZoom(clusterId, (err, zoom) => {
        if (err) return;
        map.easeTo({
          center: features[0].geometry.coordinates,
          zoom
        });
      });
    });

    /* =============================
       8. Changement du curseur au survol
       ============================= */
    map.on('mouseenter', 'unclustered-points', () => {
      map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', 'unclustered-points', () => {
      map.getCanvas().style.cursor = '';
    });
    map.on('mouseenter', 'clusters', () => {
      map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', 'clusters', () => {
      map.getCanvas().style.cursor = '';
    });
  });
</script>
</body>
</html>
